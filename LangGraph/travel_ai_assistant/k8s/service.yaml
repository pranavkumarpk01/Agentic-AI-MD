apiVersion: v1
kind: Service
metadata:
  name: travel-ai-service
spec:
  type: NodePort
  selector:
    app: travel-ai-assistant
  ports:
    - port: 8008          # ClusterIP port (internal)
      targetPort: 8008    # Container port
      nodePort: 30080     # Must match extraPortMappings.containerPort in kind-config.yaml
